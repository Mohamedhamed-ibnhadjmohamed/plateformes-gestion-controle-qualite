<nav class="navigation-bar">
    <a class="brand" routerLink="/home/accueil" aria-label="QualityMaster — Accueil">
        <img loading="lazy" src="../../../../assets/images/logo2.png" alt="QualityMaster" class="logo-image" />
    </a>

    <button class="nav-toggle" type="button" (click)="basculerMenu()" [attr.aria-expanded]="menuOuvert"
        aria-controls="nav-principal" [attr.aria-label]="menuOuvert ? 'Fermer le menu' : 'Ouvrir le menu'">
        <i class="fa-solid" [class.fa-bars]="!menuOuvert" [class.fa-xmark]="menuOuvert" aria-hidden="true"></i>
    </button>

    <div id="nav-principal" class="nav-contenu" [class.nav-contenu--ouvert]="menuOuvert">
        <ul class="nav-liens">
            @if (isAdmin) {
            <li>
                <a class="nav-lien" routerLink="/admin" (click)="fermerMenu()">
                    <i class="fa-solid fa-gauge-high" aria-hidden="true"></i> Administration
                </a>
            </li>
            }
            <li>
                <a class="nav-lien" routerLink="/home/accueil" routerLinkActive="nav-lien--actif"
                    [routerLinkActiveOptions]="{ exact: true }" (click)="fermerMenu()">
                    <i class="fa-solid fa-house" aria-hidden="true"></i> Accueil
                </a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-lien dropdown-toggle" id="menuControle" href="#" role="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <i class="fa-solid fa-list-check" aria-hidden="true"></i> Contrôle
                </a>
                <ul class="dropdown-menu" aria-labelledby="menuControle">
                    <li><a class="dropdown-item" [routerLink]="['/home/souschain']" (click)="fermerMenu()"><i
                                class="fa-solid fa-diagram-project"></i> Sous-chaîne</a></li>
                    <li><a class="dropdown-item" [routerLink]="['/home/finchain']" (click)="fermerMenu()"><i
                                class="fa-solid fa-clipboard-check"></i> Fin de chaîne</a></li>
                    <li><a class="dropdown-item" [routerLink]="['/home/audit']" (click)="fermerMenu()"><i
                                class="fa-solid fa-clipboard-list"></i> Audit</a></li>
                </ul>
            </li>
            <li>
                <a class="nav-lien" routerLink="/home/consulter" routerLinkActive="nav-lien--actif"
                    (click)="fermerMenu()">
                    <i class="fa-solid fa-file-lines" aria-hidden="true"></i> Rapports
                </a>
            </li>
            <li>
                <a class="nav-lien" routerLink="/home/analyses" routerLinkActive="nav-lien--actif"
                    (click)="fermerMenu()">
                    <i class="fa-solid fa-chart-pie" aria-hidden="true"></i> Analyses
                </a>
            </li>
            <li>
                <a class="nav-lien" [routerLink]="['/home/accueil']" fragment="information" (click)="fermerMenu()">
                    <i class="fa-solid fa-circle-info" aria-hidden="true"></i> Information
                </a>
            </li>
        </ul>

        <ul class="nav-utilisateur">
            <li class="nav-item dropdown">
                <a class="nav-lien nav-lien--utilisateur dropdown-toggle" id="menuUtilisateur" href="#" role="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="nav-avatar" aria-hidden="true">{{ initiales }}</span>
                    <span class="nav-identite">
                        <span class="nav-identite-nom">{{ nom }}</span>
                        <span class="nav-identite-role">{{ roleLabel }}</span>
                    </span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="menuUtilisateur">
                    <li class="dropdown-entete">
                        <span class="dropdown-entete-nom">{{ nom }}</span>
                        <span class="dropdown-entete-email" *ngIf="email">{{ email }}</span>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li><a class="dropdown-item" [routerLink]="['/home/parametre']" (click)="fermerMenu()"><i
                                class="fa-solid fa-gear"></i> Paramètres</a></li>
                    <li><a class="dropdown-item" [routerLink]="['/home/accueil']" fragment="contact"
                            (click)="fermerMenu()"><i class="fa-solid fa-envelope"></i> Contact</a></li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <button type="button" class="dropdown-item dropdown-item--danger" (click)="logout()">
                            <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
                        </button>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>
